name: Crypto Bot - Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    name: Test Crypto Bot

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall .

      - name: Run tests
        env:
          TRADING_MODE: PAPER
          ALLOW_LIVE_TRADING: "false"
        run: |
          if ls test_*.py >/dev/null 2>&1; then

            python -m pytest -q
            code=$?

            if [ "$code" -eq 5 ]; then
              echo "Nessun test pytest valido trovato."
              echo "Il controllo sintattico è comunque passato correttamente."
              exit 0
            fi

            exit "$code"

          else

            echo "Nessun file test_*.py trovato."
            exit 0

          fi
