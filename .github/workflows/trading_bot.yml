name: Crypto Bot - Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Test Crypto Bot
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. SCARICA IL CODICE
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. INSTALLA PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # =====================================================
      # 3. INSTALLA DIPENDENZE
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =====================================================
      # 4. CONTROLLO SINTASSI
      # =====================================================

      - name: Check Python syntax
        run: |
          python -m compileall .


      # =====================================================
      # 5. TEST
      # =====================================================

      - name: Run tests
        env:
          TRADING_MODE: PAPER
          ALLOW_LIVE_TRADING: "false"
        run: |
          if ls test_*.py >/dev/null 2>&1; then
            python -m pytest -q
          else
            echo "Nessun test automatico trovato."
          fi
