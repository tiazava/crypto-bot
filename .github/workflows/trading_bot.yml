name: Crypto Bot Scanner 24/7

on:
  schedule:
    # Esegue lo script allo scoccare di ogni ora
    - cron: '0 * * * *'
  # Permette di avviare il bot anche manualmente da GitHub quando vuoi
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Download codice
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy krakenex python-dotenv anthropic

    - name: Esegui Scansione Bot
      env:
        KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
        KRAKEN_SECRET_KEY: ${{ secrets.KRAKEN_SECRET_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        python main.py
