name: Crypto Bot - Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Crypto Bot
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall .

      - name: Check imports
        env:
          TRADING_MODE: PAPER
          ALLOW_LIVE_TRADING: "false"
        run: |
          python -c "import config"
          python -c "import strategy"
          python -c "import kraken_client"
          python -c "import anthropic_guard"
          python -c "import main"

      - name: Run tests
        env:
          TRADING_MODE: PAPER
          ALLOW_LIVE_TRADING: "false"
        run: |
          python -m pytest -q || [ $? -eq 5 ]
